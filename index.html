<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

<div class="intro" onclick="openLetter()">
    <h1>Hi (name)</h1>
    <p>i just want to greet you a happy birthday</p>
    <p style="margin-top:20px; font-size:14px;">Click to open</p>
</div>

<div class="container" id="letterContainer">
    <div class="letter">

        <p>Hi  </p>

        <p> </p>

        <p> </p>
        
        <p> </p>
        
        <p> </p>
        
        <p> </p>

        <p> </p>

        <p> </p>

        <p> </p>
        
        <div class="signature">— Ian</div>

    </div>
</div>

<script>
function openLetter() {
    document.querySelector(".intro").style.opacity = "0";
    setTimeout(() => {
        document.querySelector(".intro").style.display = "none";
        document.getElementById("letterContainer").style.display = "flex";
        document.body.style.overflow = "auto";
    }, 800);
}
</script>

</body>
</html>
